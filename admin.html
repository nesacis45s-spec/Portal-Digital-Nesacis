<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d9488"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Portal Admin · NESACIS</title><link rel="stylesheet" href="portal.css"></head>
<body>
<header class="top"><b>🛡 Portal Admin</b><span class="sp"></span><span class="nm" id="nm"></span><a href="panduan.html">Panduan</a><a href="index.html">Portal</a><button id="out" type="button">Keluar</button></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<div id="mh"></div>
<script src="config.js"></script><script src="nesacis.js"></script>
<script>
const S=NESACIS.wajib(['admin'],'admin');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['ringkasan','Ringkasan'],['guru','Akun Guru & Admin'],['murid','Akun Murid'],['siswa','Data Siswa (NISN)'],['naik','Kenaikan Kelas'],['periode','Periode'],['materi','Materi'],['backup','Backup & Restore'],['sistem','Sistem']];
let TAB='ringkasan';
const call=(a,d,o)=>NESACIS.call(a,d,o);
const pesan=r=>NESACIS.pesan(r.error);

if(S){
  $('nm').textContent=S.user.nama;$('out').onclick=()=>NESACIS.keluar('index.html');
  $('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)buka(b.dataset.t)};
  buka('ringkasan');
}
function buka(t){TAB=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('view').innerHTML='<p class="empty">Memuat…</p>';({ringkasan:vRingkasan,guru:()=>vAkun('staf'),murid:()=>vAkun('murid'),siswa:vSiswa,naik:vNaik,periode:vPeriode,materi:vMateri,backup:vBackup,sistem:vSistem})[t]()}

/* ---------- modal ---------- */
function modal(html,onOk,okText){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><form>${html}<div class="msg err hid" id="mm"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn sec" data-c>Batal</button><button class="btn" type="submit">${okText||'Simpan'}</button></div></form></div>`;
  $('mh').appendChild(m);const f=m.querySelector('form'),mm=m.querySelector('#mm');
  m.querySelector('[data-c]').onclick=()=>m.remove();
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('.btn[type=submit]');b.disabled=true;mm.classList.add('hid');
    const err=await onOk(Object.fromEntries(new FormData(f).entries()),f);b.disabled=false;
    if(err){mm.textContent=err;mm.classList.remove('hid')}else m.remove()};
  const i=f.querySelector('input,select');if(i)i.focus();return m;
}
const info=(t,h)=>{const m=modal(`<h2>${esc(t)}</h2>${h}`,()=>{},'Tutup');m.querySelector('[data-c]').remove()};
function konfirm(judul,teks,fn,kata){
  modal(`<h2>${esc(judul)}</h2><p>${teks}</p>${kata?`<label>Ketik <b>${kata}</b> untuk melanjutkan</label><input name="k" autocomplete="off">`:''}`,async v=>{
    if(kata&&v.k!==kata)return 'Konfirmasi tidak cocok.';return await fn()},'Ya, lanjutkan');
}

/* ---------- ringkasan ---------- */
async function vRingkasan(){
  const r=await call('ad_ringkasan');if(!r.ok)return $('view').innerHTML=`<div class="msg err">${esc(pesan(r))}</div>`;
  const c=[['Guru',r.guru],['Murid terdaftar',r.murid],['Admin',r.admin],['Siswa di data sekolah',r.siswa],['Periode',r.periode],['Ulangan',r.ulangan],['Hasil ulangan',r.hasil],['Materi',r.materi]];
  const nm={akun:'Akun',jurnal:'Jurnal',nilai:'Nilai',absensi:'Absensi',ulangan:'Ulangan',materi:'Materi'};
  $('view').innerHTML=`<h1>Ringkasan</h1><div class="grid">${c.map(x=>`<div class="tile" style="cursor:default"><span>${x[0]}</span><div class="stat">${x[1]}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><h2>6 file database</h2><p class="mut">Semua data tersimpan di spreadsheet berikut (dibuka lewat akun pemilik skrip). Jangan ubah isinya manual saat aplikasi dipakai.</p>
  <div class="row">${Object.keys(r.urls).map(k=>`<a class="btn sec sm" href="${esc(r.urls[k])}" target="_blank" rel="noopener">${nm[k]} ↗</a>`).join('')}</div></div>`;
}

/* ---------- akun ---------- */

/* ---------- daftar dengan filter, urutan, dan halaman ---------- */
const alamiah=(a,b)=>String(a).localeCompare(String(b),'id',{numeric:true,sensitivity:'base'});
const tingkatDari=k=>{const c=String(k||'').charAt(0);return '789'.includes(c)&&c?c:''};
const opsiHtml=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`).join('');
const unik=(arr,f)=>[...new Set(arr.map(f).filter(Boolean))].sort(alamiah);
function buatDaftar(c){
  /* c: items(), cari(item), saring:[{id,label,opsi(all,F)->[[v,l]],cocok(item,v)}], urut:{key:[label,cmp]}, kepala, kolom, baris(item), kosong, placeholder, satuan */
  const F={q:'',page:1,size:50,urut:Object.keys(c.urut)[0]};c.saring.forEach(x=>F[x.id]='');
  const norm=t=>String(t==null?'':t).toLowerCase();
  const aktifJml=()=>c.saring.filter(x=>F[x.id]).length+(F.q.trim()?1:0);
  function bar(){
    const all=c.items();
    const sel=c.saring.map(x=>{const o=[['','Semua']].concat(x.opsi(all,F));if(!o.some(y=>String(y[0])===F[x.id]))F[x.id]='';
      return `<div><label>${x.label}</label><select data-f="${x.id}">${opsiHtml(o,F[x.id])}</select></div>`}).join('');
    $('fbar').innerHTML=`<div class="fgrid"><div style="grid-column:span 2"><label>Cari</label><input data-q placeholder="${esc(c.placeholder)}" value="${esc(F.q)}" autocomplete="off"></div>${sel}
      <div><label>Urutkan</label><select data-u>${opsiHtml(Object.keys(c.urut).map(k=>[k,c.urut[k][0]]),F.urut)}</select></div>
      <div><label>Per halaman</label><select data-s>${opsiHtml([25,50,100,200].map(n=>[n,n]),F.size)}</select></div>
      <div><button class="btn sec" data-reset ${aktifJml()?'':'disabled'}>Reset filter${aktifJml()?' ('+aktifJml()+')':''}</button></div></div>`;
  }
  function render(){
    const all=c.items(),q=norm(F.q).split(/\s+/).filter(Boolean);
    const L=all.filter(it=>{if(q.length){const h=norm(c.cari(it));if(!q.every(t=>h.includes(t)))return false}return c.saring.every(x=>!F[x.id]||x.cocok(it,F[x.id]))});
    L.sort(c.urut[F.urut][1]);
    const hal=Math.max(1,Math.ceil(L.length/F.size));if(F.page>hal)F.page=hal;
    const a=(F.page-1)*F.size,b=Math.min(L.length,a+F.size);
    $('t').innerHTML=c.kepala+'<tbody>'+(L.length?L.slice(a,b).map(c.baris).join(''):`<tr><td colspan="${c.kolom}" class="empty">${aktifJml()?'Tidak ada '+c.satuan+' yang cocok dengan filter.':c.kosong}</td></tr>`)+'</tbody>';
    $('fsum').innerHTML=L.length?`Menampilkan <b>${a+1}–${b}</b> dari <b>${L.length}</b> ${c.satuan}${L.length!==all.length?` (total ${all.length})`:''}`:`0 ${c.satuan} dari total ${all.length}`;
    const pg=`<div class="pg"><button class="btn sec sm" data-p="1" ${F.page<=1?'disabled':''}>«</button><button class="btn sec sm" data-p="${F.page-1}" ${F.page<=1?'disabled':''}>‹ Sebelumnya</button><span class="mut">Hal. ${F.page} / ${hal}</span><button class="btn sec sm" data-p="${F.page+1}" ${F.page>=hal?'disabled':''}>Berikutnya ›</button><button class="btn sec sm" data-p="${hal}" ${F.page>=hal?'disabled':''}>»</button></div>`;
    $('fpg').innerHTML=pg;$('fpg2').innerHTML=hal>1?pg:'';
  }
  const host=$('lst');
  host.onchange=e=>{const t=e.target;
    if(t.dataset.f){F[t.dataset.f]=t.value;F.page=1;bar();render()}
    else if(t.dataset.u!==undefined){F.urut=t.value;F.page=1;render()}
    else if(t.dataset.s!==undefined){F.size=Number(t.value);F.page=1;render()}};
  host.oninput=e=>{if(e.target.dataset.q!==undefined){F.q=e.target.value;F.page=1;render();const r=host.querySelector('[data-reset]');if(r){r.disabled=!aktifJml();r.textContent='Reset filter'+(aktifJml()?' ('+aktifJml()+')':'')}}};
  host.onclick=e=>{const b=e.target.closest('[data-p],[data-reset]');if(!b||b.disabled)return;
    if(b.dataset.reset!==undefined){F.q='';c.saring.forEach(x=>F[x.id]='');F.page=1;bar();render()}
    else{F.page=Number(b.dataset.p);render();$('t').parentNode.scrollTop=0}};
  bar();render();
  return {segarkan(){bar();render()}};
}
const barisAtas=()=>'<div id="lst"><div class="card fbar"><div id="fbar"></div></div><div class="row" style="margin:0 0 6px"><span class="mut grow" id="fsum"></span><div id="fpg"></div></div>';
const barisBawah='<div id="fpg2" style="margin-top:8px"></div></div>';

let AK=[],LST=null;
async function vAkun(peran){
  const r=await call('ad_akun_list',{peran});if(!r.ok)return $('view').innerHTML=`<div class="msg err">${esc(pesan(r))}</div>`;
  AK=r.akun;const m=peran==='murid';
  $('view').innerHTML=`<div class="row"><h1 class="grow" style="margin:0">${m?'Akun Murid':'Akun Guru & Admin'} <span class="mut">(${AK.length})</span></h1>
   <button class="btn" id="add">+ Tambah akun</button></div>
   ${m?'<p class="mut">Akun murid dipakai untuk melihat <b>Hasil Belajarku</b> (login NISN). Tidak ada pendaftaran mandiri: buat akun satu per satu di sini, atau sekaligus lewat Data Siswa &gt; <b>Buat akun murid</b>. Materi dan ulangan tidak memerlukan akun.</p>':'<p class="mut">Guru tidak dapat mendaftar sendiri; akun dibuat di sini. Isi email agar guru bisa memakai fitur “Lupa password”.</p>'}
   ${barisAtas()}<div class="tw tall"><table id="t"></table></div>${barisBawah}`;
  const kepalaT=`<thead><tr><th>${m?'NISN':'Username'}</th><th>Nama</th><th>${m?'Kelas / Absen':'Peran / Email'}</th>${m?'':'<th>Ulangan</th>'}<th>Status</th><th></th></tr></thead>`;
  const lst=buatDaftar({items:()=>AK,placeholder:m?'NISN, nama, kelas…':'username, nama, email…',satuan:'akun',kosong:'Belum ada akun.',kolom:m?5:6,kepala:kepalaT,
    cari:a=>[a.username,a.nama,a.email,a.kelas,a.nisn].join(' '),
    saring:m?[
      {id:'tk',label:'Tingkat',opsi:()=>[['7','Kelas 7'],['8','Kelas 8'],['9','Kelas 9']],cocok:(a,v)=>tingkatDari(a.kelas)===v},
      {id:'kl',label:'Kelas',opsi:(all,F)=>unik(all.filter(a=>!F.tk||tingkatDari(a.kelas)===F.tk),a=>a.kelas).map(k=>[k,k]),cocok:(a,v)=>a.kelas===v},
      {id:'st',label:'Status',opsi:()=>[['aktif','Aktif'],['nonaktif','Nonaktif']],cocok:(a,v)=>v==='aktif'?a.aktif:!a.aktif},
      {id:'ab',label:'Nomor absen',opsi:()=>[['kosong','Belum diisi'],['isi','Sudah diisi']],cocok:(a,v)=>v==='kosong'?!a.absen:!!a.absen}
    ]:[
      {id:'pr',label:'Peran',opsi:()=>[['guru','Guru'],['admin','Admin']],cocok:(a,v)=>a.peran===v},
      {id:'st',label:'Status',opsi:()=>[['aktif','Aktif'],['nonaktif','Nonaktif']],cocok:(a,v)=>v==='aktif'?a.aktif:!a.aktif},
      {id:'em',label:'Email',opsi:()=>[['kosong','Belum diisi'],['isi','Sudah diisi']],cocok:(a,v)=>v==='kosong'?!a.email:!!a.email},
      {id:'ul',label:'Ulangan',opsi:()=>[['ada','Punya ulangan'],['nol','Belum punya']],cocok:(a,v)=>v==='ada'?a.ulangan>0:a.ulangan===0}
    ],
    urut:m?{kelas:['Kelas & absen',(a,b)=>(!a.kelas)-(!b.kelas)||alamiah(a.kelas,b.kelas)||(Number(a.absen)||999)-(Number(b.absen)||999)||alamiah(a.nama,b.nama)],nama:['Nama A-Z',(a,b)=>alamiah(a.nama,b.nama)],nisn:['NISN',(a,b)=>alamiah(a.username,b.username)],baru:['Terbaru dibuat',(a,b)=>b.dibuat-a.dibuat]}
      :{nama:['Nama A-Z',(a,b)=>alamiah(a.nama,b.nama)],user:['Username',(a,b)=>alamiah(a.username,b.username)],ul:['Jumlah ulangan',(a,b)=>b.ulangan-a.ulangan],baru:['Terbaru dibuat',(a,b)=>b.dibuat-a.dibuat]},
    baris:a=>`<tr><td>${esc(a.username)}</td><td>${esc(a.nama)}</td>
     <td>${m?esc(a.kelas)+' / '+esc(a.absen):`<span class="badge ${a.peran==='admin'?'run':''}">${a.peran}</span> ${esc(a.email)}`}</td>${m?'':`<td>${a.ulangan}</td>`}
     <td><span class="badge ${a.aktif?'ok':'bad'}">${a.aktif?'Aktif':'Nonaktif'}</span></td>
     <td style="white-space:nowrap"><button class="btn sm sec" data-a="ubah" data-u="${esc(a.username)}">Ubah</button> <button class="btn sm sec" data-a="reset" data-u="${esc(a.username)}">Reset sandi</button>
     ${a.username===S.user.username?'':`<button class="btn sm sec" data-a="aktif" data-u="${esc(a.username)}">${a.aktif?'Nonaktifkan':'Aktifkan'}</button> <button class="btn sm bad" data-a="hapus" data-u="${esc(a.username)}">Hapus</button>`}</td></tr>`});
  LST=lst;

  $('add').onclick=()=>formAkun(null,peran);
  $('t').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=AK.find(x=>x.username===b.dataset.u),k=b.dataset.a;
    if(k==='ubah')formAkun(a,peran);
    if(k==='reset')modal(`<h2>Reset password ${esc(a.username)}</h2><label>Password baru (min. 6 karakter)</label><input name="pw" autocomplete="off" minlength="6" required>`,async v=>{const r=await call('ad_akun_reset',{username:a.username,password:v.pw});if(!r.ok)return pesan(r)});
    if(k==='aktif')call('ad_akun_aktif',{username:a.username,aktif:!a.aktif}).then(r=>r.ok?segarAkun(peran):info('Gagal',esc(pesan(r))));
    if(k==='hapus')konfirm('Hapus akun '+a.username+'?',m?'Akun murid dihapus. Hasil ulangan tetap tersimpan. Murid dapat mendaftar ulang.':'Ulangan milik akun ini dipindahkan ke akun Anda. Data jurnal guru tetap tersimpan di spreadsheet.',async()=>{const r=await call('ad_akun_hapus',{username:a.username});if(!r.ok)return pesan(r);segarAkun(peran)});
  };
}
async function segarAkun(peran){   // muat ulang data tetapi pertahankan filter, urutan, dan halaman
  const r=await call('ad_akun_list',{peran});if(!r.ok)return info('Gagal',esc(pesan(r)));
  AK=r.akun;const h=document.querySelector('h1 .mut');if(h)h.textContent='('+AK.length+')';if(LST)LST.segarkan();
}
function formAkun(a,peran){
  const m=peran==='murid',baru=!a;
  modal(`<h2>${baru?'Tambah':'Ubah'} akun ${m?'murid':'guru/admin'}</h2>
   <label>${m?'NISN':'Username'}</label><input name="username" value="${esc(a?a.username:'')}" ${baru?'':'readonly'} required autocomplete="off">
   <label>Nama lengkap</label><input name="nama" value="${esc(a?a.nama:'')}" required maxlength="60">
   ${m?`<div class="row"><div class="grow"><label>Kelas (mis. 9A)</label><input name="kelas" value="${esc(a?a.kelas:'')}" required maxlength="5"></div><div class="grow"><label>No. absen (opsional)</label><input name="absen" type="number" min="1" max="99" value="${esc(a?a.absen:'')}"></div></div>`
     :`<label>Email (opsional, untuk lupa password)</label><input name="email" type="email" value="${esc(a?a.email:'')}">
       <label>Peran</label><select name="peran">${['guru','admin'].map(p=>`<option ${a&&a.peran===p?'selected':''}>${p}</option>`).join('')}</select>`}
   ${baru?'<label>Password awal (min. 6 karakter)</label><input name="password" minlength="6" required autocomplete="off">':''}`,
  async v=>{const d=Object.assign({},v,{peran:m?'murid':v.peran});if(m)d.nisn=v.username;
    const r=await call(baru?'ad_akun_tambah':'ad_akun_ubah',d);if(!r.ok)return pesan(r);segarAkun(peran)});
}

/* ---------- data siswa ---------- */
async function vSiswa(){
  $('view').innerHTML=`<h1>Data Siswa (NISN)</h1><p class="mut">Daftar resmi siswa sekolah. Dipakai untuk membuat akun murid dan sebagai sumber “Ambil dari Spreadsheet” di Jurnal Guru. Kolom <b>Guru</b> (opsional) membatasi baris itu hanya untuk guru bersangkutan (username/email, pisahkan koma).</p>
  <div class="card"><div class="row"><button class="btn" id="imp">Impor Excel / CSV</button><button class="btn sec" id="tpl">Unduh format</button><button class="btn sec" id="jr">Tarik dari data jurnal guru</button><button class="btn" id="bam">Buat akun murid</button><button class="btn sec" id="del" style="margin-left:auto;color:var(--bad)">Hapus semua</button></div><input type="file" id="fi" accept=".xlsx,.xls,.csv" hidden><div id="sm"></div></div>
  <div class="mut" id="jml"></div>${barisAtas()}<div class="tw tall"><table id="t"></table></div>${barisBawah}`;
  SWL=null;$('imp').onclick=()=>$('fi').click();$('fi').onchange=impor;
  $('tpl').onclick=async()=>{await xlsx();const ws=XLSX.utils.aoa_to_sheet([['NIS','NISN','Nama','Jenis Kelamin','Kelas','Absen','Guru'],['1234','0123456789','Contoh Siswa','L','9A','1','']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siswa');XLSX.writeFile(wb,'Format_Data_Siswa.xlsx')};
  $('jr').onclick=()=>konfirm('Tarik dari data jurnal guru','Semua siswa yang sudah diimpor guru di periode aktif akan ditambahkan ke daftar ini (data yang sudah ada tidak ditimpa).',async()=>{const r=await call('ad_siswa_dari_jurnal',{},{timeout:120000});if(!r.ok)return pesan(r);$('sm').innerHTML=`<div class="msg ok">${r.baru} siswa baru, ${r.ubah} dilengkapi, dari ${r.guru} guru.</div>`;muat()});
  $('del').onclick=()=>konfirm('Hapus semua data siswa?','Hanya daftar NISN yang dihapus. Akun murid tidak ikut terhapus.',async()=>{const r=await call('ad_siswa_hapus',{semua:true,konfirmasi:'HAPUS'});if(!r.ok)return pesan(r);muat()},'HAPUS');
  $('bam').onclick=()=>modal(`<h2>Buat akun murid dari Data Siswa</h2><p>Akun dibuat untuk semua siswa yang belum punya akun (username = NISN). Siswa tanpa kelas yang valid dilewati.</p><label>Password awal (kosongkan = NISN masing-masing)</label><input name="pw" autocomplete="off" placeholder="min. 6 karakter, atau kosong">`,async v=>{
    const x=await call('ad_murid_buat',{password:v.pw},{timeout:240000});if(!x.ok)return pesan(x);const l=x.lewat;
    $('sm').innerHTML=`<div class="msg ok">${x.dibuat} akun dibuat (password awal: ${esc(x.passwordAwal)}). Dilewati: ${l.sudahAda} sudah punya akun, ${l.kelasTidakValid} kelas tidak valid, ${l.namaTidakValid} nama tidak valid, ${l.nisnTidakValid} NISN tidak valid, ${l.nisnPendek} password &lt; 6 karakter.</div>`;muat()},'Buat akun');
  muat();
}
let SW=[],SWL=null;
async function muat(){
  const r=await call('ad_siswa_list',{});
  if(!r.ok){$('t').innerHTML=`<tbody><tr><td class="empty">${esc(pesan(r))}</td></tr></tbody>`;return}
  SW=r.siswa;
  if(!SWL)SWL=buatDaftar({items:()=>SW,placeholder:'NISN, NIS, nama, kelas…',satuan:'siswa',kosong:'Belum ada data siswa. Impor dari Excel.',kolom:9,
    kepala:`<thead><tr><th>NIS</th><th>NISN</th><th>Nama</th><th>JK</th><th>Kelas</th><th>Absen</th><th>Guru</th><th>Akun</th><th></th></tr></thead>`,
    cari:s=>[s.nis,s.nisn,s.nama,s.kelas].join(' '),
    saring:[
      {id:'tk',label:'Tingkat',opsi:()=>[['7','Kelas 7'],['8','Kelas 8'],['9','Kelas 9']],cocok:(s,v)=>tingkatDari(s.kelas)===v},
      {id:'kl',label:'Kelas',opsi:(all,F)=>unik(all.filter(s=>!F.tk||tingkatDari(s.kelas)===F.tk),s=>s.kelas).map(k=>[k,k]),cocok:(s,v)=>s.kelas===v},
      {id:'ak',label:'Akun murid',opsi:()=>[['ada','Sudah punya akun'],['belum','Belum punya akun']],cocok:(s,v)=>v==='ada'?s.akun:!s.akun},

      {id:'dt',label:'Kelengkapan data',opsi:()=>[['nokelas','Kelas kosong / tidak valid'],['noabsen','Nomor absen kosong'],['nonis','NIS kosong'],['nojk','Jenis kelamin kosong']],

const prog=(p,t)=>{$('pg').hidden=false;$('pb').style.width=Math.round(p*100)+'%';$('pt').textContent=t};
async function backup(){
  const b=$('bk');b.disabled=true;
  try{
    const inf=await call('ad_backup_info');if(!inf.ok)throw new Error(pesan(inf));
    const out={app:'NESACIS',versi:1,dibuat:new Date().toISOString(),sheets:[],berkas:{}};
    const total=inf.sheets.reduce((a,s)=>a+s.baris,0)||1;let done=0;
    for(const s of inf.sheets){
      const e={file:s.file,sheet:s.sheet,headers:[],rows:[]};let dari=0;
      for(;;){const r=await call('ad_backup_sheet',{file:s.file,sheet:s.sheet,dari,jumlah:s.sheet==='Data'?3:300},{timeout:120000});if(!r.ok)throw new Error(pesan(r));
        e.headers=r.headers;e.rows.push(...r.rows);dari=r.next;done+=r.rows.length;prog(done/total*(.8),`Membaca ${s.file}/${s.sheet}… ${dari}/${r.total}`);if(r.selesai)break}
      out.sheets.push(e);
    }
    if($('bf').checked){const m=out.sheets.find(s=>s.file==='materi'),n=m?m.rows.length:0;
      for(let i=0;i<n;i++){const id=m.rows[i][0];prog(.8+.2*i/n,`Mengambil berkas materi ${i+1}/${n}…`);const r=await call('materi_ambil',{id},{timeout:120000});if(r.ok)out.berkas[id]=r.data}}
    prog(1,'Selesai. Mengunduh file…');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='Backup_NESACIS_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  }catch(e){prog(0,'Gagal: '+e.message)}finally{b.disabled=false}
}

    $('rs').disabled=true;
    try{
      const total=d.sheets.length+Object.keys(d.berkas||{}).length;let n=0;
      for(const s of d.sheets){
        prog(n/total,`Memulihkan ${s.file}/${s.sheet}…`);
        let i=0,first=true;
        do{let sz=0,j=i;while(j<s.rows.length&&(j===i||sz<1500000)){sz+=JSON.stringify(s.rows[j]).length;j++}
          const r=await call('ad_restore_sheet',{file:s.file,sheet:s.sheet,rows:s.rows.slice(i,j),first,last:j>=s.rows.length},{timeout:180000});
          if(!r.ok)throw new Error(s.file+'/'+s.sheet+': '+pesan(r));first=false;i=j}while(i<s.rows.length);
        n++;
      }
      for(const id of Object.keys(d.berkas||{})){prog(n/total,'Memulihkan berkas materi…');const r=await call('ad_restore_materi',{id,data:d.berkas[id]},{timeout:180000});if(!r.ok)throw new Error(pesan(r));n++}
      prog(1,'Pemulihan selesai. Muat ulang halaman jika data belum tampil.');
    }catch(e){prog(0,'Gagal: '+e.message);return e.message}finally{$('rs').disabled=false}
  },'PULIHKAN');
}

/* ---------- sistem ---------- */

  $('view').innerHTML=`<h1>Sistem</h1>
  <div class="card"><h2>Ubah password saya</h2><div class="row"><input id="p1" type="password" placeholder="Password lama" class="grow"><input id="p2" type="password" placeholder="Password baru (min. 6)" class="grow"><button class="btn" id="pw">Simpan</button></div><div id="pm"></div></div>
  <div class="card"><h2>Rekap Hasil Belajar murid</h2><p class="mut">Rekap diperbarui otomatis setiap guru menyimpan, sehingga halaman Hasil Belajarku cepat. Bangun ulang rekap bila Anda baru memulihkan backup lama atau memindahkan data dari aplikasi sebelumnya.</p>
   <div class="row"><select id="rp" class="grow"></select><button class="btn" id="rb">Bangun ulang rekap periode ini</button></div><div id="rm"></div></div>
  <div class="card"><h2>Kosongkan data ulangan</h2><p class="mut">Menghapus semua peserta &amp; hasil ulangan (atau juga semua ulangan &amp; soal). Tidak bisa dibatalkan — lakukan backup dulu.</p>
   <div class="row"><button class="btn bad" id="k1">Kosongkan peserta &amp; hasil</button><button class="btn bad" id="k2">Kosongkan semua ulangan &amp; soal</button></div></div>`;
  $('rp').innerHTML=r.periodes.map(p=>`<option value="${esc(p.id)}" ${p.aktif?'selected':''}>${esc(p.label)}</option>`).join('');
  $('rb').onclick=async()=>{const b=$('rb');b.disabled=true;const x=await call('ad_rekap_bangun',{periode:$('rp').value},{timeout:240000});b.disabled=false;$('rm').innerHTML=x.ok?`<div class="msg ok">Selesai: ${x.guru} guru, ${x.murid} murid.</div>`:`<div class="msg err">${esc(pesan(x))}</div>`};
  $('pw').onclick=async()=>{const x=await call('changePassword',{oldPassword:$('p1').value,newPassword:$('p2').value});$('pm').innerHTML=x.ok?'<div class="msg ok">Password diganti.</div>':`<div class="msg err">${esc(pesan(x))}</div>`;if(x.ok){$('p1').value=$('p2').value=''}};
  const kos=mode=>konfirm('Kosongkan data ulangan?','Tindakan ini tidak dapat dibatalkan.',async()=>{const x=await call('ad_kosongkan',{mode,konfirmasi:'KOSONGKAN'});if(!x.ok)return pesan(x);alert(x.peserta+' peserta dan '+x.hasil+' hasil dihapus.')},'KOSONGKAN');
  $('k1').onclick=()=>kos('siswa');$('k2').onclick=()=>kos('semua');
}
</script></body></html>
