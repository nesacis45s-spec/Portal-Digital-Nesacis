<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Digitalisasi Pembelajaran NESACIS</title>
<!-- Jika di-hosting sendiri, Bootstrap 5 dimuat dari CDN ini (halaman tetap tampil tanpa itu) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1a;--tx:#dff4ff;--mut:#8fb3c9;--c:#35d0ff;--c2:#7a6bff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,#0b1b3a,var(--bg) 70%);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#net{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
.grid{position:fixed;inset:0;background:linear-gradient(rgba(53,208,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(53,208,255,.05) 1px,transparent 1px) 0 0/44px 44px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
#landing{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;transition:opacity .8s}
.tag{letter-spacing:.35em;color:var(--c);font-size:.85rem;text-transform:uppercase}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(1.5rem,5vw,3.2rem);margin:.4rem 0 0;line-height:1.15;background:linear-gradient(90deg,#fff,var(--c),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(53,208,255,.35))}
#stage{position:relative;width:min(340px,92vw);height:300px;margin-top:2rem;--d:92px}
.orb{position:absolute;left:50%;top:50%;border:0;border-radius:50%;color:#fff;font-family:Orbitron,sans-serif;font-weight:700;cursor:pointer;display:grid;place-items:center;text-align:center;padding:0;
background:radial-gradient(circle at 32% 28%,#6fe3ff,#1a7bd6 55%,#12306e);box-shadow:0 0 30px rgba(53,208,255,.45),inset 0 0 22px rgba(255,255,255,.25),0 24px 40px rgba(0,0,0,.5)}
#main{width:210px;height:210px;margin:-105px 0 0 -105px;font-size:1.3rem;letter-spacing:.12em;animation:float 3.4s ease-in-out infinite;transition:opacity .45s,transform .45s}
#main{background:radial-gradient(circle at 34% 28%,#1f6fb8,#0b2750 55%,#040d22);overflow:hidden;box-shadow:0 0 40px rgba(53,208,255,.5),0 0 90px rgba(53,208,255,.2),inset 0 0 30px rgba(53,208,255,.45),inset -18px -22px 40px rgba(0,0,0,.55)}
#main svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(120,225,255,.5);stroke-width:1}
#main .mer ellipse{transform-box:fill-box;transform-origin:center;animation:spin 6s ease-in-out infinite}
#main .edge{stroke:rgba(150,235,255,.85);stroke-width:1.6}
#main .dots circle{fill:#c9f6ff;stroke:none;animation:pulse 2.4s ease-in-out infinite}
#main .gt{position:relative;z-index:1;text-shadow:0 0 10px #02102a,0 0 18px rgba(53,208,255,.9)}
#main:hover{box-shadow:0 0 54px rgba(53,208,255,.75),0 0 110px rgba(53,208,255,.3),inset 0 0 30px rgba(53,208,255,.55),inset -18px -22px 40px rgba(0,0,0,.55)}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.02)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.split #main{opacity:0;transform:scale(.6);pointer-events:none;animation:none}
.sp{width:148px;height:148px;margin:-74px 0 0 -74px;font-size:.95rem;letter-spacing:.08em;opacity:0;transform:translateX(0) scale(.3);pointer-events:none;transition:transform .8s cubic-bezier(.2,1.2,.3,1),opacity .5s,box-shadow .6s ease}
.sp span{grid-area:1/1;transition:opacity .5s ease,transform .5s ease}
.sp .h{opacity:0;transform:scale(.94);font-size:.78rem;line-height:1.3}
.sp:hover .n,.sp:focus-visible .n{opacity:0;transform:scale(1.06)}
.split .sp:hover{animation-play-state:paused}
.sp:hover .h,.sp:focus-visible .h{opacity:1;transform:scale(1)}
.sp:hover{box-shadow:0 0 46px rgba(53,208,255,.7),inset 0 0 22px rgba(255,255,255,.3),0 24px 40px rgba(0,0,0,.5)}
#guru{--s:120,225,255;--e:205,245,255;--g:53,208,255;background:radial-gradient(circle at 34% 28%,#1f6fb8,#0b2750 55%,#040d22);box-shadow:0 0 36px rgba(53,208,255,.5),0 0 70px rgba(53,208,255,.18),inset 0 0 26px rgba(53,208,255,.45),inset -14px -18px 30px rgba(0,0,0,.55)}
#guru:hover{box-shadow:0 0 50px rgba(53,208,255,.75),0 0 90px rgba(53,208,255,.3),inset 0 0 26px rgba(53,208,255,.55),inset -14px -18px 30px rgba(0,0,0,.55)}
#murid{--s:190,170,255;--e:230,220,255;--g:150,120,255;background:radial-gradient(circle at 34% 28%,#5a45c8,#231a5e 55%,#0b0724);box-shadow:0 0 36px rgba(122,107,255,.55),0 0 70px rgba(122,107,255,.2),inset 0 0 26px rgba(150,120,255,.45),inset -14px -18px 30px rgba(0,0,0,.55)}
#murid:hover{box-shadow:0 0 50px rgba(150,120,255,.8),0 0 90px rgba(122,107,255,.35),inset 0 0 26px rgba(150,120,255,.55),inset -14px -18px 30px rgba(0,0,0,.55)}
.split .sp{opacity:1;pointer-events:auto;animation:float 3.6s ease-in-out infinite .8s}
.split #guru{transform:translateX(calc(var(--d)*-1)) scale(1)}
.split #murid{transform:translateX(var(--d)) scale(1)}
.sp{overflow:hidden;padding-top:58px}
.sp svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(var(--s),.5);stroke-width:1}
.sp .mer ellipse{transform-box:fill-box;transform-origin:center;animation:spin 6s ease-in-out infinite}
.sp .edge{stroke:rgba(var(--s),.85);stroke-width:1.6}
.sp .dots circle{fill:rgb(var(--e));stroke:none;animation:pulse 2.4s ease-in-out infinite}
.sp .ic{stroke:rgb(var(--e));stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(var(--g),.95))}
.sp .ic circle{fill:rgb(var(--e));stroke:none}
.sp span{position:relative;z-index:1;text-shadow:0 0 8px #02102a,0 0 14px rgba(var(--g),.9)}
@keyframes float{0%,100%{translate:0 -10px}50%{translate:0 12px}}
#light{position:fixed;z-index:20;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,#f2fbff 0 18%,rgba(110,200,255,.55) 42%,rgba(60,120,255,.18) 62%,transparent 72%)}
#menu{position:fixed;inset:0;z-index:10;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
#menu h2{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(1.2rem,3.4vw,2rem);margin:0 0 .3rem}
#menu p{color:var(--mut);margin:0 0 2rem}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:980px}
.card-m{width:250px;padding:28px 20px;border-radius:18px;text-decoration:none;color:var(--tx);background:rgba(20,45,90,.45);border:1px solid rgba(53,208,255,.3);box-shadow:0 0 24px rgba(53,208,255,.08);backdrop-filter:blur(6px);opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s,box-shadow .3s,border-color .3s}
.show .card-m{opacity:1;transform:none}
.card-m:hover{border-color:var(--c);box-shadow:0 0 30px rgba(53,208,255,.35);transform:translateY(-6px);color:#fff}
.card-m .ic{font-size:2.4rem;display:block;margin-bottom:.6rem}
.card-m b{font-family:Orbitron,sans-serif;font-size:1rem;display:block}
.card-m small{color:var(--mut);font-size:.95rem}
.back{margin-top:2rem;background:none;border:1px solid rgba(143,179,201,.4);color:var(--mut);padding:8px 22px;border-radius:30px;font-family:inherit;font-size:1rem;cursor:pointer;transition:.3s}
.back:hover{color:#fff;border-color:var(--c)}

#adminBtn{margin-top:1.6rem;background:rgba(20,45,90,.45);border:1px solid rgba(53,208,255,.3);color:var(--mut);padding:9px 22px;border-radius:30px;font-family:Orbitron,sans-serif;font-size:.72rem;letter-spacing:.18em;cursor:pointer;transition:.3s;backdrop-filter:blur(6px)}
#adminBtn:hover,#adminBtn:focus-visible{color:#fff;border-color:var(--c);box-shadow:0 0 24px rgba(53,208,255,.35)}
#who{margin:-1.2rem 0 1.6rem;font-size:1rem;color:var(--mut);min-height:1.4em}
#who b{color:var(--tx)}#who button{background:none;border:0;color:var(--c);cursor:pointer;font:inherit;text-decoration:underline;padding:0 0 0 6px}
#auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,8,22,.78);backdrop-filter:blur(8px);overflow:auto}
#auth.on{display:flex}
.apanel{width:min(400px,100%);background:linear-gradient(160deg,rgba(18,40,84,.96),rgba(8,18,44,.97));border:1px solid rgba(53,208,255,.35);border-radius:20px;padding:26px 22px;box-shadow:0 0 50px rgba(53,208,255,.18);margin:auto;position:relative}
.apanel h3{font-family:Orbitron,sans-serif;font-size:1.05rem;margin:0 0 4px}
.apanel .sub{color:var(--mut);margin:0 0 14px;font-size:.98rem}
.atabs{display:flex;gap:6px;margin-bottom:14px}
.atabs button{flex:1;background:rgba(53,208,255,.08);border:1px solid rgba(53,208,255,.25);color:var(--mut);border-radius:10px;padding:7px;font:inherit;font-weight:600;cursor:pointer}
.atabs button.on{background:rgba(53,208,255,.22);color:#fff;border-color:var(--c)}
.apanel label{display:block;font-size:.92rem;color:var(--mut);margin:10px 0 4px}
.apanel input,.apanel select{width:100%;background:rgba(3,10,28,.8);border:1px solid rgba(53,208,255,.3);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;font-size:1.05rem;outline:none}
.apanel input:focus,.apanel select:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(53,208,255,.18)}
.arow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.abtn{width:100%;margin-top:16px;padding:11px;border:0;border-radius:12px;background:linear-gradient(90deg,#1a8bd6,#6a5bff);color:#fff;font-family:Orbitron,sans-serif;font-size:.85rem;letter-spacing:.1em;cursor:pointer}
.abtn:disabled{opacity:.6;cursor:wait}
.alink{background:none;border:0;color:var(--c);font:inherit;cursor:pointer;padding:0;margin-top:12px;text-decoration:underline;font-size:.95rem}
.amsg{margin-top:12px;padding:9px 11px;border-radius:10px;font-size:.95rem;display:none}
.amsg.err{display:block;background:rgba(255,80,100,.14);color:#ff9fb0;border:1px solid rgba(255,80,100,.35)}
.amsg.ok{display:block;background:rgba(60,220,150,.13);color:#8cf0c4;border:1px solid rgba(60,220,150,.35)}
.aclose{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--mut);font-size:1.4rem;cursor:pointer}
.hid{display:none!important}
.small-note{color:var(--mut);font-size:.88rem;margin:8px 0 0}
@media(max-width:420px){#stage{--d:80px}.sp{padding-top:48px}.sp{width:128px;height:128px;margin:-64px 0 0 -64px}}
</style>
</head>

<script>
const DATA={
 guru:{t:"PORTAL GURU",s:"Selamat datang, Bapak/Ibu Guru",i:[["📘","Jurnal Harian Guru","Jurnal, absensi, nilai, dan Materi Pembelajaran","jurnalguru.html"],["📝","Ulangan Online","Buat dan kelola ulangan digital","ulangan.html"]]},
 murid:{t:"PORTAL MURID",s:"Selamat datang, siswa NESACIS",i:[["🚀","Aku Ingin Belajar","Materi dan pembelajaran dari guru","materi.html"],["📊","Hasil Belajarku","Lihat nilai, kehadiran, dan hasil ulangan","hasil.html"],["🎯","Ujianku","Kerjakan ulangan secara online","ulangan.html"]]},
 admin:{t:"PORTAL ADMIN",s:"Kelola akun, data siswa, periode, dan backup",i:[["🛡️","Panel Admin","Akun guru & murid, data siswa, backup & restore","admin.html"]]}
};
const PERAN_OK={guru:['guru','admin'],murid:['murid'],admin:['admin']};
const $=s=>document.querySelector(s),stage=$('#stage'),menu=$('#menu'),light=$('#light'),landing=$('#landing');
let busy=false,ROLE='';
$('#main').onclick=()=>stage.classList.add('split');
document.querySelectorAll('.sp,#adminBtn').forEach(b=>b.onclick=()=>enter(b));
function enter(btn){
 if(busy)return;busy=true;
 const r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,d=DATA[btn.dataset.role];
 ROLE=btn.dataset.role;$('#mt').textContent=d.t;$('#ms').textContent=d.s;refreshWho();
 $('#cards').innerHTML=d.i.map((c,k)=>`<a href="${c[3]}" class="card-m" style="transition-delay:${k*.1}s"><span class="ic">${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></a>`).join('');
 light.style.left=x+'px';light.style.top=y+'px';
 // cahaya lembut: titik kecil -> membesar -> memudar (tidak menyilaukan)
 light.animate([{opacity:0,transform:'scale(.4)'},{opacity:.85,transform:'scale(1.2)',offset:.18},{opacity:.4,transform:'scale(40)',offset:.7},{opacity:0,transform:'scale(90)'}],{duration:1400,easing:'ease-in-out'});
 landing.style.opacity=0;
 menu.style.visibility='visible';
 menu.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(150vmax at ${x}px ${y}px)`}],{duration:1000,delay:300,easing:'ease-in',fill:'both'});
 setTimeout(()=>menu.classList.add('show'),700);
}
$('#back').onclick=()=>{
 menu.classList.remove('show');
 const a=menu.animate([{opacity:1},{opacity:0}],{duration:500});
 a.onfinish=()=>{menu.getAnimations().forEach(x=>x.cancel());menu.style.visibility='hidden';landing.style.opacity=1;stage.classList.remove('split');busy=false};
};

// ---------- status akun di menu + klik kartu ----------
function refreshWho(){
 const s=NESACIS.session(),w=$('#who');
 if(s&&PERAN_OK[ROLE]&&PERAN_OK[ROLE].includes(s.user.peran)){
  w.innerHTML='Masuk sebagai <b></b> · '+s.user.peran+'<button type="button" id="keluar">Keluar</button>';
  w.querySelector('b').textContent=s.user.nama;
  $('#keluar').onclick=()=>{NESACIS.keluar('index.html')};
 }else w.textContent='Kamu akan diminta masuk saat membuka salah satu menu.';
}
$('#cards').addEventListener('click',e=>{
 const a=e.target.closest('a.card-m');if(!a)return;e.preventDefault();
 const s=NESACIS.session();
 if(s&&PERAN_OK[ROLE].includes(s.user.peran))location.href=a.getAttribute('href');else openAuth(ROLE,a.getAttribute('href'));
});

// ---------- login / daftar / lupa password ----------
const A={role:'',next:'',mode:'login'},amsg=$('#amsg');
const NEXT_OK=/^[\w\-]+\.html(\?[^#\s]*)?(#\S*)?$/;
function msg(t,k){amsg.className='amsg'+(t?' '+(k||'err'):'');amsg.textContent=t||''}
function setMode(m){
 A.mode=m;msg('');
 $('#f-login').classList.toggle('hid',m!=='login');$('#f-daftar').classList.toggle('hid',m!=='daftar');$('#f-lupa').classList.toggle('hid',m!=='lupa');
 $('#atabs').classList.toggle('hid',!(A.role==='murid'&&m!=='lupa'));
 $('#atabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('#at').textContent=m==='daftar'?'Daftar Akun Murid':m==='lupa'?'Lupa Password':({guru:'Masuk Guru',murid:'Masuk Murid',admin:'Masuk Admin'})[A.role];
 $('#as').textContent=m==='daftar'?'Buat akun dengan NISN dan password pilihanmu.':m==='lupa'?'':({guru:'Gunakan akun yang dibuat admin sekolah.',murid:'Username-mu adalah NISN.',admin:'Khusus pengelola aplikasi.'})[A.role];
}
function openAuth(role,next){
 A.role=role;A.next=NEXT_OK.test(next||'')?next:'';
 $('#l-ulabel').textContent=role==='murid'?'NISN':role==='guru'?'Username atau email':'Username';
 $('#l-user').inputMode=role==='murid'?'numeric':'text';
 $('#l-lupa').classList.toggle('hid',role!=='guru');
 setMode('login');$('#auth').classList.add('on');setTimeout(()=>$('#l-user').focus(),50);
}
function closeAuth(){$('#auth').classList.remove('on')}
$('#aclose').onclick=closeAuth;$('#auth').addEventListener('click',e=>{if(e.target.id==='auth')closeAuth()});
$('#atabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)});
$('#l-lupa').onclick=()=>{setMode('lupa');$('#g-id').value=$('#l-user').value};
$('#g-back').onclick=()=>setMode('login');
$('#d-huruf').innerHTML='ABCDEFGHI'.split('').map(h=>`<option>${h}</option>`).join('');
function sibuk(btn,on,t){if(!btn.dataset.t)btn.dataset.t=btn.textContent;btn.disabled=on;btn.textContent=on?(t||'MEMPROSES…'):btn.dataset.t}
function sukses(res){
 NESACIS.save(res);closeAuth();
 if(A.next)location.href=A.next;else refreshWho();
}
$('#f-login').addEventListener('submit',async e=>{
 e.preventDefault();msg('');const b=$('#l-btn');sibuk(b,true,'MEMERIKSA…');
 const r=await NESACIS.call('login',{username:$('#l-user').value.trim(),password:$('#l-pass').value,portal:A.role},{tanpaToken:true,tanpaRedirect:true});
 sibuk(b,false);
 if(!r.ok)return msg(NESACIS.pesan(r.error));
 $('#l-pass').value='';sukses(r);
});
$('#f-daftar').addEventListener('submit',async e=>{
 e.preventDefault();msg('');
 if($('#d-pass').value!==$('#d-pass2').value)return msg('Konfirmasi password tidak sama.');
 const b=$('#d-btn');sibuk(b,true,'MEMBUAT AKUN…');
 const r=await NESACIS.call('murid_daftar',{nisn:$('#d-nisn').value.trim(),nama:$('#d-nama').value,kelas:$('#d-tingkat').value+$('#d-huruf').value,absen:$('#d-absen').value,password:$('#d-pass').value},{tanpaToken:true,tanpaRedirect:true});
 sibuk(b,false);
 if(!r.ok)return msg(NESACIS.pesan(r.error));
 sukses(r);
});
$('#f-lupa').addEventListener('submit',async e=>{
 e.preventDefault();msg('');const b=$('#g-btn'),step2=!$('#g-step2').classList.contains('hid'),id=$('#g-id').value.trim();
 if(!step2){
  sibuk(b,true,'MENGIRIM…');const r=await NESACIS.call('forgot',{email:id},{tanpaToken:true,tanpaRedirect:true});sibuk(b,false);
  if(!r.ok)return msg(NESACIS.pesan(r.error));
  $('#g-step2').classList.remove('hid');b.dataset.t='SIMPAN PASSWORD BARU';b.textContent='SIMPAN PASSWORD BARU';
  msg('Jika akun punya email, kode 6 digit sudah dikirim (cek folder Spam). Berlaku 15 menit. Tidak ada email? Minta admin mengatur ulang password.','ok');
 }else{
  const code=$('#g-code').value.trim(),pw=$('#g-pass').value;
  if(!code||pw.length<6)return msg('Isi kode dan password baru (minimal 6 karakter).');
  sibuk(b,true,'MENYIMPAN…');const r=await NESACIS.call('reset',{email:id,code:code,newPassword:pw},{tanpaToken:true,tanpaRedirect:true});sibuk(b,false);
  if(!r.ok)return msg(NESACIS.pesan(r.error));
  $('#g-step2').classList.add('hid');$('#g-code').value='';$('#g-pass').value='';b.dataset.t='KIRIM KODE';b.textContent='KIRIM KODE';
  setMode('login');$('#l-user').value=id;msg('Password berhasil diganti. Silakan masuk.','ok');
 }
});
// tautan dari halaman lain yang butuh login: index.html?masuk=guru&next=jurnalguru.html
(function(){
 const p=new URLSearchParams(location.search),m=p.get('masuk');
 if(m&&PERAN_OK[m]){ROLE=m;openAuth(m,p.get('next')||'');history.replaceState(null,'',location.pathname)}
})();
if(!NESACIS.API_URL){const n=document.createElement('div');n.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:60;background:#7a1f2b;color:#fff;padding:8px 12px;text-align:center;font-size:.9rem';n.textContent='Aplikasi belum dihubungkan ke database: isi API_URL di file config.js.';document.body.appendChild(n)}

// latar jaringan partikel
const cv=$('#net'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/18|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
addEventListener('resize',rs);rs();
(function f(){cx.clearRect(0,0,W,H);
 P.forEach((p,i)=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;cx.fillStyle='rgba(120,220,255,.8)';cx.fillRect(p.x,p.y,2,2);
  for(let j=i+1;j<P.length;j++){const q=P[j],dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<130){cx.strokeStyle=`rgba(53,208,255,${.22*(1-dd/130)})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});
 requestAnimationFrame(f)})();
</script>
